<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tesoura da marca (a mesma do topo do painel), redesenhada para a aba do
       navegador. Tres diferencas, todas por causa dos 16px em que a aba mostra
       o icone: fundo escuro proprio, para nao desaparecer nem na aba clara nem
       na escura; traco mais grosso, senao vira um borrao; e em pe, com os cabos
       embaixo e as laminas cruzando para cima — deitada, do jeito que fica no
       topo, ela some no tamanho da aba.
       O transform gira a tesoura e recentraliza: girada, a caixa do desenho
       deixa de ficar no meio do quadro. -->
  <rect width="32" height="32" rx="7" fill="#171a21"/>
  <g transform="translate(2.47 1.91) scale(1.127) rotate(-90 12 12)"
     fill="none" stroke="#c9a15b" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="3"/>
    <circle cx="6" cy="18" r="3"/>
    <path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/>
  </g>
</svg>
